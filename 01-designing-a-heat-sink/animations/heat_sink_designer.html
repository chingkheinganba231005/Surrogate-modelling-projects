<style>
:root { --bg:#07080d; --panel:#121522; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#ffb347; --rule:#272c3d; --ok:#5fd38d; --bad:#ff6b6b; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
#stage { flex:1 1 560px; min-width:0; }
canvas { background:#04050a; border:1px solid var(--rule); border-radius:6px; width:100%; display:block; }
#side { flex:0 1 340px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:50%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
.status { margin-top:8px; padding:6px 9px; border-radius:5px; font-weight:600; font-size:14px; }
.row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>

  return `<label>${label} <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span id="${id}v">${fmt(val)}</span></label>`; }
function designControls() {
  return `<div class="ctl">${slider('sN', 'Fins N', 5, 40, 1, st.N, v => v)}${slider('sH', 'Height H', 10, 50, 0.5, st.H, v => v + ' mm')}
    ${slider('st', 'Thickness t', 0.5, 3, 0.05, st.t, v => (+v).toFixed(2) + ' mm')}${slider('sb', 'Base b', 2, 10, 0.1, st.b, v => (+v).toFixed(1) + ' mm')}</div>
    <div class="row"><button id="best">Load the BO optimum</button><button id="reset">Reset</button></div>`; }
function wireDesign() {
  [['sN', 'N', v => v], ['sH', 'H', v => v + ' mm'], ['st', 't', v => (+v).toFixed(2) + ' mm'], ['sb', 'b', v => (+v).toFixed(1) + ' mm']].forEach(([id, k, f]) => {
    const el = document.getElementById(id); el.oninput = () => { st[k] = +el.value; document.getElementById(id + 'v').textContent = f(el.value); draw(); }; });
  document.getElementById('best').onclick = () => { Object.assign(st, D.best); setTab(tab); };
  document.getElementById('reset').onclick = () => { Object.assign(st, { N: 20, H: 40, t: 1.0, b: 6.0 }); setTab(tab); };
}
function evalDesign() {
  const gap = (C.W * 1e3 - st.N * st.t) / (st.N - 1), feasible = gap >= 1;
  const out = { gap, feasible, m: mass(st.N, st.H, st.t, st.b) };
  if (gap <= 0.05) return out;
  const ft = finTheory(st.N, st.H / 1e3, st.t / 1e3, st.b / 1e3); Object.assign(out, { ft, p: predict(st.N, st.H, st.t, st.b) });
  return out;
}
// ---------- tab 1: design studio ----------
function drawDesign() {
  const e = evalDesign(); ctx.clearRect(0, 0, W, Hh);
  const top = 30, sh = Hh * 0.42, scale = Math.min((W - 80) / 60, sh / 62), x0 = (W - 60 * scale) / 2, yb = top + sh;
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Cross-section to scale (colour: temperature from the fin equation)', 12, 18);
  if (!e.p) { ctx.fillStyle = '#ff6b6b'; ctx.fillText('No room for the fins: reduce N or t.', 12, 40); return; }
  const Tc = C.T_air + C.Q * e.p.R, Tair = C.T_air, Tlo = 35, Thi = 110, col = T => heat((T - Tlo) / (Thi - Tlo));
  // base: chip temperature (surrogate) at the bottom, fin-root temperature at the top
  const Rb = e.ft.R, f = e.ft.f, Troot = Tair + C.Q * (Rb - st.b / 1e3 / (C.k_al * C.W * C.L)) * (e.p.R / Rb);
  const bh = st.b * scale, nseg = 12;
  for (let k = 0; k < nseg; k++) { const T = Tc + (Troot - Tc) * (k + 0.5) / nseg; ctx.fillStyle = col(T); ctx.fillRect(x0, yb - bh * (k + 1) / nseg, 60 * scale, bh / nseg + 0.5); }
  const s = e.gap, m = e.ft.m, Hc = e.ft.Hc, hpx = st.H * scale, segs = 30;
  for (let i = 0; i < st.N; i++) { const xf = x0 + i * (st.t + s) * scale;
    for (let k = 0; k < segs; k++) { const y = (k + 0.5) / segs * st.H / 1e3, th = Math.cosh(m * (Hc - y)) / Math.cosh(m * Hc);
      ctx.fillStyle = col(Tair + (Troot - Tair) * th); ctx.fillRect(xf, yb - bh - hpx * (k + 1) / segs, Math.max(1, st.t * scale), hpx / segs + 0.5); } }
  ctx.fillStyle = '#e4572e'; ctx.fillRect(x0 + 20 * scale, yb, 20 * scale, 6);
  for (let i = 0; i <= 5; i++) { ctx.fillStyle = col(Tlo + i * (Thi - Tlo) / 5); ctx.fillRect(W - 40, top + 8 + (5 - i) * 18, 14, 18); ctx.fillStyle = '#9aa0b4'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.fillText((Tlo + i * (Thi - Tlo) / 5).toFixed(0) + '°', W - 44, top + 20 + (5 - i) * 18); }
  // mass vs R plot
  const py = yb + 40, ph = Hh - py - 46, a = axes(70, py, W - 100, ph, [0, 420], [0.4, 2.2], 'Mass (g)', 'R (K/W)', true);
  ctx.strokeStyle = '#ff6b6b'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(a.X(0), a.Y(C.T_max / C.Q - C.T_air / C.Q)); ctx.lineTo(a.X(420), a.Y(0.5)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(154,160,180,.55)'; D.runs.forEach(r => { ctx.beginPath(); ctx.arc(a.X(r.m), a.Y(r.r), 2.4, 0, 7); ctx.fill(); });
  ctx.strokeStyle = '#2a9df4'; ctx.lineWidth = 2; ctx.beginPath(); D.front.forEach(([mm, rr], i) => i ? ctx.lineTo(a.X(mm), a.Y(rr)) : ctx.moveTo(a.X(mm), a.Y(rr))); ctx.stroke(); ctx.lineWidth = 1;
  const ok = e.feasible && e.p.hi <= 0.5, X = a.X(Math.min(e.m, 420)), Y = a.Y(Math.min(Math.max(e.p.R, 0.4), 2.2));
  ctx.strokeStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(X, a.Y(Math.max(e.p.lo, 0.4))); ctx.lineTo(X, a.Y(Math.min(e.p.hi, 2.2))); ctx.stroke();
  ctx.fillStyle = ok ? '#5fd38d' : '#ffb347'; ctx.beginPath(); ctx.arc(X, Y, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#9aa0b4'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('● simulator runs   — Pareto front   - - 85 °C limit   ● your design (±95%)', 76, py + 14);
  const T = C.T_air + C.Q * e.p.R, inDom = st.N >= 5 && st.N <= 40;
  document.getElementById('ro').textContent =
`surrogate R  = ${e.p.R.toFixed(4)} K/W
  95% range  = ${e.p.lo.toFixed(4)} – ${e.p.hi.toFixed(4)}
chip temp.   = ${T.toFixed(1)} °C  (limit ${C.T_max} °C)
1D fin theory= ${e.ft.R.toFixed(4)} K/W  (${(100 * (e.ft.R / e.p.R - 1)).toFixed(1)}%)
mass         = ${e.m.toFixed(1)} g
gap s        = ${e.gap.toFixed(2)} mm
air: U = ${f.U.toFixed(2)} m/s, Δp = ${f.dp.toFixed(1)} Pa
h = ${f.h.toFixed(1)} W/m²K, Re = ${f.Re.toFixed(0)}`;
  const sEl = document.getElementById('stat');
  if (!e.feasible) { sEl.textContent = 'Not manufacturable: gap below 1 mm (outside the surrogate\'s domain)'; sEl.style.background = '#4a1d22'; }
  else if (e.p.hi <= 0.5) { sEl.textContent = '✓ Meets 85 °C, even at the upper 95% bound'; sEl.style.background = '#173a26'; }
  else if (e.p.R <= 0.5) { sEl.textContent = '≈ Meets 85 °C on average, but not with 95% confidence'; sEl.style.background = '#3d3215'; }
  else { sEl.textContent = '✗ Too hot: chip above 85 °C'; sEl.style.background = '#4a1d22'; }
}
// ---------- tab 2: fan curve and a live sweep over the number of fins ----------
function drawFan() {
  const e = evalDesign(); ctx.clearRect(0, 0, W, Hh);
  const h1 = Hh * 0.42, a = axes(70, 30, W - 100, h1 - 40, [0, 8], [0, 60], 'Approach velocity U (m/s)', 'Pressure (Pa)');
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('The operating point: fan curve (white) meets the heat sink\'s system curve (orange)', 12, 18);
  if (e.p) { const f = e.ft.f;
    ctx.strokeStyle = '#e8e6e1'; ctx.lineWidth = 2; ctx.beginPath(); for (let u = 0; u <= 8; u += 0.05) { const p = f.fanDp(u); if (p < 0) break; u ? ctx.lineTo(a.X(u), a.Y(p)) : ctx.moveTo(a.X(u), a.Y(p)); } ctx.stroke();
    ctx.strokeStyle = '#ffb347'; ctx.beginPath(); let first = true; for (let u = 0.02; u <= 8; u += 0.05) { const p = f.ductDp(u); if (p > 60) break; first ? ctx.moveTo(a.X(u), a.Y(p)) : ctx.lineTo(a.X(u), a.Y(p)); first = false; } ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = '#5fd38d'; ctx.beginPath(); ctx.arc(a.X(f.U), a.Y(f.dp), 6, 0, 7); ctx.fill(); }
  const y2 = h1 + 34, b = axes(70, y2, W - 100, Hh - y2 - 46, [5, 40], [0.3, 2.2], 'Number of fins N (other dimensions fixed)', 'R (K/W)', true);
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Surrogate sweep over N, with its 95% band (shaded red: no room for the fins)', 76, y2 + 16);
  const pts = []; for (let n = 5; n <= 40; n++) { const gap = (C.W * 1e3 - n * st.t) / (n - 1); if (gap < 1) { ctx.fillStyle = 'rgba(255,107,107,.12)'; ctx.fillRect(b.X(n - 0.5), y2, b.X(n + 0.5) - b.X(n - 0.5), Hh - y2 - 46); continue; } pts.push([n, predict(n, st.H, st.t, st.b), finTheory(n, st.H / 1e3, st.t / 1e3, st.b / 1e3).R]); }
  const cl = v => Math.min(Math.max(v, 0.3), 2.2);
  if (pts.length) {
    ctx.fillStyle = 'rgba(255,179,71,.25)'; ctx.beginPath(); pts.forEach(([n, p], i) => i ? ctx.lineTo(b.X(n), b.Y(cl(p.hi))) : ctx.moveTo(b.X(n), b.Y(cl(p.hi)))); pts.slice().reverse().forEach(([n, p]) => ctx.lineTo(b.X(n), b.Y(cl(p.lo)))); ctx.fill();
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.beginPath(); pts.forEach(([n, p], i) => i ? ctx.lineTo(b.X(n), b.Y(cl(p.R))) : ctx.moveTo(b.X(n), b.Y(cl(p.R)))); ctx.stroke();
    ctx.strokeStyle = '#2a9df4'; ctx.setLineDash([4, 3]); ctx.beginPath(); pts.forEach(([n, , r], i) => i ? ctx.lineTo(b.X(n), b.Y(cl(r))) : ctx.moveTo(b.X(n), b.Y(cl(r)))); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    const best = pts.reduce((a, c) => c[1].R < a[1].R ? c : a);
    ctx.fillStyle = '#9aa0b4'; ctx.fillText(`best N here: ${best[0]} (R = ${best[1].R.toFixed(3)} K/W)   — surrogate   - - 1D fin theory`, 76, y2 + 32);
    if (e.p) { ctx.fillStyle = '#5fd38d'; ctx.beginPath(); ctx.arc(b.X(st.N), b.Y(cl(e.p.R)), 6, 0, 7); ctx.fill(); }
  }
  ctx.strokeStyle = '#ff6b6b'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(b.X(5), b.Y(0.5)); ctx.lineTo(b.X(40), b.Y(0.5)); ctx.stroke(); ctx.setLineDash([]);
  if (e.p) document.getElementById('ro').textContent = `U = ${e.ft.f.U.toFixed(2)} m/s   Δp = ${e.ft.f.dp.toFixed(1)} Pa\nflow = ${(e.ft.f.U * C.W * st.H / 1e3 * 1000).toFixed(2)} L/s   h = ${e.ft.f.h.toFixed(1)} W/m²K`;
}
// ---------- tab 3: replay of the notebook's optimizer race ----------
let step = 0, timer = null;
function drawRace() {
  ctx.clearRect(0, 0, W, Hh);
  const h1 = Hh * 0.5, a = axes(70, 30, W - 100, h1 - 50, [0, 100], [100, 300], 'Number of simulator runs', 'Lightest feasible (g)');
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('Best verified design so far (chip ≤ 85 °C)', 12, 18);
  const line = (tr, colr, n) => { ctx.strokeStyle = colr; ctx.lineWidth = 2.5; ctx.beginPath(); let st0 = false;
    for (let i = 0; i < Math.min(n, tr.length); i++) { if (tr[i] === null) continue; const y = a.Y(Math.min(tr[i], 300)); st0 ? ctx.lineTo(a.X(i + 1), y) : ctx.moveTo(a.X(i + 1), y); st0 = true; } ctx.stroke(); ctx.lineWidth = 1; };
  line(D.trace_rand, '#9aa0b4', step); line(D.trace_bo, '#ffb347', step);
  ctx.strokeStyle = '#3a4058'; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(a.X(15), 30); ctx.lineTo(a.X(15), h1 - 20); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#9aa0b4'; ctx.fillText('— random search', a.X(60), 52); ctx.fillStyle = '#ffb347'; ctx.fillText('— constrained BO (stops at 40)', a.X(60), 68);
  const y2 = h1 + 20, b = axes(70, y2, W - 100, Hh - y2 - 46, [0, 420], [0.4, 2.2], 'Mass (g)', 'R (K/W)', true);
  ctx.strokeStyle = '#ff6b6b'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(b.X(0), b.Y(0.5)); ctx.lineTo(b.X(420), b.Y(0.5)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#2a9df4'; ctx.beginPath(); D.front.forEach(([mm, rr], i) => i ? ctx.lineTo(b.X(mm), b.Y(rr)) : ctx.moveTo(b.X(mm), b.Y(rr))); ctx.stroke();
  D.bo_runs.slice(0, step).forEach((r, i) => { ctx.fillStyle = i < 15 ? '#9aa0b4' : (i === step - 1 ? '#5fd38d' : '#ffb347'); ctx.beginPath(); ctx.arc(b.X(Math.min(r.m, 420)), b.Y(Math.min(Math.max(r.r, 0.4), 2.2)), i === step - 1 ? 6 : 3.5, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#9aa0b4'; ctx.textAlign = 'left'; ctx.fillText('BO runs: gray = initial design, orange = chosen by the acquisition function', 76, y2 + 16);
  const bo = D.trace_bo[Math.min(step, 40) - 1], rd = D.trace_rand[Math.min(step, 100) - 1];
  document.getElementById('ro').textContent = `run ${step}\nBO best:     ${bo ? bo.toFixed(1) + ' g' : step > 40 ? '' : '—'}\nrandom best: ${rd ? rd.toFixed(1) + ' g' : '—'}`;
}
function draw() { if (tab === 'design') drawDesign(); else if (tab === 'fan') drawFan(); else drawRace(); }
function setTab(t) {
  tab = t; clearInterval(timer); timer = null;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'design') side.innerHTML = `<h2>Design studio</h2><p>Every prediction comes from the project's final surrogate: a GP with a Matérn 5/2 kernel on seven physics features (including the 1D fin theory), trained on ${NTR} simulator runs. It answers in well under a millisecond.</p>
    <div class="math">R̂ = exp(μ(x) ± 1.96σ(x))\nT_chip = T_air + Q·R̂</div>${designControls()}<div class="status" id="stat"></div><div class="readout" id="ro"></div>
    <p style="margin-top:8px;font-size:12.5px;color:#9aa0b4">The fin colours use the fin equation θ(y) ∝ cosh(m(H<sub>c</sub>−y)), scaled to the surrogate's prediction. They are an illustration, not the 3D field.</p>`;
  else if (t === 'fan') side.innerHTML = `<h2>Fan &amp; fin count</h2><p>More fins add area but narrow the channels: the system curve steepens, the operating point slides to less air, and ​h drops. The bottom panel sweeps N with the surrogate at your H, t and b: watch the optimum move as you change them.</p>
    <div class="math">p₀(1 − U·W·H/V̇max) = (4f·L/Dₕ + K_c + K_e)·ρU_c²/2</div>${designControls()}<div class="readout" id="ro"></div>`;
  else side.innerHTML = `<h2>Optimizer race</h2><p>A replay of the notebook: constrained Bayesian optimization (15 initial runs, then 25 runs chosen by the acquisition function) against random search. Only designs verified by the simulator count.</p>
    <div class="math">a(x) = max(m_best − mass(x), 0) · Φ((log R_max − μ)/σ)</div><div class="row"><button id="play">▶ Play</button><button id="stepb">Step</button><button id="rs">Reset</button></div><div class="readout" id="ro"></div>`;
  if (t !== 'race') wireDesign();
  else { step = 0;
    document.getElementById('play').onclick = () => { if (timer) { clearInterval(timer); timer = null; return; } timer = setInterval(() => { step = Math.min(100, step + 1); draw(); if (step >= 100) { clearInterval(timer); timer = null; } }, 140); };
    document.getElementById('stepb').onclick = () => { step = Math.min(100, step + 1); draw(); };
    document.getElementById('rs').onclick = () => { step = 0; draw(); }; }
  draw();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', resize);
setTab('design'); resize();
</script>
