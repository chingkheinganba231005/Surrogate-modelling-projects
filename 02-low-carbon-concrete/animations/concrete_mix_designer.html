html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:7px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:48%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
.status { margin-top:8px; padding:6px 9px; border-radius:5px; font-weight:600; font-size:14px; }
.row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>

  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'design') {
    const sl = [0, 1, 2, 3, 4, 6].map(i => `<label>${NAMES[i]} <input type="range" id="m${i}" min="${D.low[i]}" max="${D.high[i]}" step="0.5" value="${mix[i]}"><span id="m${i}v">${mix[i].toFixed(0)}</span></label>`).join('');
    side.innerHTML = `<h2>Mix designer</h2><p>Quantities in kg per m³. The coarse aggregate is computed so that the mix fills exactly one cubic metre, as in the notebook. The strength comes from the project's monotonic gradient-boosting model; the lower bound subtracts the conformal margin of ${D.q95.toFixed(1)} MPa. The buttons load the project's trust-region designs (certified by both the boosting model and the GP).</p>
      <div class="ctl">${sl}</div><div class="row">${Object.keys(D.designs).map(k => `<button data-c="${k}">Load C${k} design</button>`).join('')}</div><div class="status" id="stat"></div><div class="readout" id="ro"></div>`;
    [0, 1, 2, 3, 4, 6].forEach(i => { const el = document.getElementById('m' + i); el.oninput = () => { mix[i] = +el.value; document.getElementById('m' + i + 'v').textContent = (+el.value).toFixed(0); draw(); }; });
    side.querySelectorAll('button[data-c]').forEach(b => b.onclick = () => { D.designs[b.dataset.c].forEach((v, i) => mix[i] = v); setTab('design'); });
  } else if (t === 'abrams') {
    side.innerHTML = `<h2>Abrams' law (1918)</h2><p>Strength falls exponentially with the water/binder ratio: extra water leaves pores. Slag and fly ash bind too, but more slowly. Move the sliders to see the fitted physics model for different ages and binder compositions.</p>
      <div class="math">f = A / B^(w/b) = A·e^(−k·w/b)</div><div class="ctl"><label>Age (days) <input type="range" id="age" min="3" max="365" step="1" value="28"><span id="agev">28</span></label>
      <label>SCM share <input type="range" id="scm" min="0" max="0.7" step="0.01" value="0"><span id="scmv">0%</span></label></div><div class="readout" id="ro"></div>`;
    ['age', 'scm'].forEach(id => { const el = document.getElementById(id); el.oninput = () => { document.getElementById(id + 'v').textContent = id === 'scm' ? Math.round(el.value * 100) + '%' : el.value; draw(); }; });
  } else {
    step = 10;
    side.innerHTML = `<h2>Lab campaign</h2><p>The 417 recipes tested at 28 days play the role of candidate experiments with hidden results. Bayesian optimization (a GP on the revealed tests and the constrained acquisition function) chooses the next one; random testing picks blindly. Goal: the lowest-CO₂ mix with at least 48 MPa.</p>
      <div class="math">a(x) = max(CO₂_best − CO₂(x), 0) · Φ((μ(x) − 48)/σ(x))</div><div class="row"><button id="play">▶ Play</button><button id="stepb">Step</button><button id="rs">Reset</button></div><div class="readout" id="ro"></div>`;
    document.getElementById('play').onclick = () => { if (timer) { clearInterval(timer); timer = null; return; } timer = setInterval(() => { step = Math.min(60, step + 1); draw(); if (step >= 60) { clearInterval(timer); timer = null; } }, 160); };
    document.getElementById('stepb').onclick = () => { step = Math.min(60, step + 1); draw(); };
    document.getElementById('rs').onclick = () => { step = 10; draw(); };
  }
  draw();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', resize);
setTab('design'); resize();
</script>
</body>
</html>
