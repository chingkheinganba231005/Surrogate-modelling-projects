<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate Emulator</title>
<style>
:root { --bg:#07080d; --panel:#121522; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#ff8a65; --rule:#272c3d; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
#stage { flex:1 1 560px; min-width:0; }
canvas { background:#04050a; border:1px solid var(--rule); border-radius:6px; width:100%; display:block; }
#side { flex:0 1 340px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:50%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>
</head>
<body>
<header>
  <h1>Climate emulator: a Gaussian process trained on NorESM2</h1>
  <div class="tabs" id="tabs">
    <button data-tab="scen" class="on">1 · Scenario builder</button>
    <button data-tab="map">2 · Warming map</button>
    <button data-tab="budget">3 · Carbon budget</button>
  </div>
</header>

  document.getElementById('ro').textContent = `cumulative CO₂ in 2100 = ${(sc.rows[85][0] * 1000).toFixed(0)} GtCO₂\npeak warming = ${peak.toFixed(2)} K (${YEARS[g.indexOf(peak)]})\nwarming in 2100 = ${g[85].toFixed(2)} ± ${D.band95.toFixed(2)} K`;
}
function rdbu(v, vmax) { const t = Math.max(-1, Math.min(1, v / vmax)); const c = t < 0 ? [[5,48,97],[247,247,247]] : [[247,247,247],[103,0,31]]; const f = t < 0 ? t + 1 : t; return `rgb(${c[0].map((a, i) => Math.round(a + (c[1][i] - a) * f))})`; }
function drawMap() {
  ctx.clearRect(0, 0, W, H);
  const sc = scenario(st.nz, st.aer), i = st.year - 2015, e = emulate(sc.rows[i], true);
  const mw = W - 40, mh = Math.min(H - 70, mw / 2), x0 = 20, y0 = 36, cw = mw / NLON, ch = mh / NLAT, vmax = 4;
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.fillText(`Emulated warming in ${st.year} (K), net zero in ${st.nz}`, 12, 20);
  for (let la = 0; la < NLAT; la++) for (let lo = 0; lo < NLON; lo++) {
    const v = e.map[la * NLON + ((lo + NLON / 2) % NLON)]; ctx.fillStyle = rdbu(v, vmax);
    ctx.fillRect(x0 + lo * cw, y0 + (NLAT - 1 - la) * ch, cw + 0.6, ch + 0.6); }
  for (let k = 0; k <= 8; k++) { ctx.fillStyle = rdbu(-vmax + k * vmax / 4, vmax); ctx.fillRect(x0 + k * 36, y0 + mh + 12, 36, 10); ctx.fillStyle = '#9aa0b4'; ctx.fillText((-vmax + k * vmax / 4).toFixed(0), x0 + k * 36 + 12, y0 + mh + 36); }
  let land = 0, arctic = 0, na = 0, nw = 0; for (let la = 0; la < NLAT; la++) for (let lo = 0; lo < NLON; lo++) { const v = e.map[la * NLON + lo]; if (D.lat[la] > 66.5) { arctic += v * W8[la]; na += W8[la]; } nw += W8[la]; land += v * W8[la]; }
  document.getElementById('ro').textContent = `global mean = ${e.g.toFixed(2)} K\nArctic (> 66.5°N) = ${(arctic / na).toFixed(2)} K  (×${(arctic / na / e.g).toFixed(1)} global)`;
}
function drawBudget() {
  ctx.clearRect(0, 0, W, H);
  const pts = []; for (let nz = 2030; nz <= 2100; nz += 5) { const sc = scenario(nz, st.aer); const g = sc.rows.map(r => emulate(r).g); pts.push([nz, sc.rows[85][0] * 1000, Math.max(...g), g[85]]); }
  const a = axes(64, 30, W - 94, H - 80, [1800, 3600], [0.6, 2.0], 'Cumulative CO₂ emissions in 2100 (GtCO₂)', 'Warming (K)');
  ctx.fillStyle = '#e8e6e1'; ctx.font = '13px sans-serif'; ctx.fillText('Each dot: one net-zero year (2030 … 2100). Peak and 2100 warming.', 12, 18);
  line(pts.map(p => p[1]), pts.map(p => p[2]), a.X, a.Y, '#ff8a65', 2.5); line(pts.map(p => p[1]), pts.map(p => p[3]), a.X, a.Y, '#7fd1b9', 1.5, [5, 4]);
  pts.forEach(p => { ctx.fillStyle = '#ff8a65'; ctx.beginPath(); ctx.arc(a.X(p[1]), a.Y(p[2]), 3.5, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#9aa0b4'; ctx.fillText('— peak warming   - - warming in 2100', 70, 48);
  const slope = (pts[pts.length - 1][2] - pts[0][2]) / (pts[pts.length - 1][1] - pts[0][1]) * 1000;
  document.getElementById('ro').textContent = `GP slope: ${slope.toFixed(2)} K per 1000 GtCO₂\nNorESM2's TCRE: 0.45 K per 1000 GtCO₂\nThe GP flattens toward the edge of its\ndata (Figure 4-7): trust the trend, not\nthe slope, far from the training runs.`;
}
function draw() { if (tab === 'scen') drawScen(); else if (tab === 'map') drawMap(); else drawBudget(); }
function controls(withYear) {
  return `<div class="ctl"><label>Net-zero CO₂ in <input type="range" id="nz" min="2030" max="2100" step="1" value="${st.nz}"><span id="nzv">${st.nz}</span></label>
  <label>Aerosols &amp; CH₄ <input type="range" id="aer" min="0" max="2" step="0.05" value="${st.aer}"><span id="aerv"></span></label>
  ${withYear ? `<label>Year <input type="range" id="yr" min="2015" max="2100" step="1" value="${st.year}"><span id="yrv">${st.year}</span></label>` : ''}</div><div class="readout" id="ro"></div>`;
}
const aerName = v => v < 0.5 ? 'like SSP1-2.6 (clean air)' : v < 1.5 ? 'like SSP2-4.5' : 'like SSP3-7.0 (polluted)';
function wire() {
  const el = id => document.getElementById(id);
  el('nz').oninput = () => { st.nz = +el('nz').value; el('nzv').textContent = st.nz; draw(); };
  el('aer').oninput = () => { st.aer = +el('aer').value; el('aerv').textContent = aerName(st.aer); draw(); }; el('aerv').textContent = aerName(st.aer);
  if (el('yr')) el('yr').oninput = () => { st.year = +el('yr').value; el('yrv').textContent = st.year; draw(); };
}
function setTab(t) {
  tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'scen') side.innerHTML = `<h2>Scenario builder</h2><p>CO₂ emissions follow SSP2-4.5 until 2020, then fall linearly to zero in the year you choose. Methane and aerosol emissions are blended between existing scenarios. The emulator turns each year's inputs (cumulative CO₂, CH₄, 5 SO₂ and 5 black-carbon EOF scores) into a warming, exactly as in the notebook.</p><div class="math">T̂(x) = μ + σ · Σᵢ k(x, xᵢ) αᵢ</div>${controls(false)}`;
  else if (t === 'map') side.innerHTML = `<h2>Warming map</h2><p>The same emulator predicts the 20 PCA scores of the map with a shared Matérn kernel; the map is the mean pattern plus the scores times the patterns. Watch polar amplification and land–sea contrast appear, and the aerosol slider change the Northern Hemisphere.</p><div class="math">map(x) = mean + Σⱼ zⱼ(x) · patternⱼ</div>${controls(true)}`;
  else side.innerHTML = `<h2>Carbon budget</h2><p>Sweep the net-zero year from 2030 to 2100: peak warming grows almost linearly with cumulative emissions. The slope is the transient climate response to cumulative emissions of NorESM2, as seen through the emulator.</p>${controls(false)}`;
  wire(); draw();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', resize);
setTab('scen'); resize();
</script>
</body>
