<title>Soil Heat Explorer</title>
<style>
:root { --bg:#07080d; --panel:#121522; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#f6c453; --rule:#272c3d; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
#stage { flex:1 1 560px; min-width:0; }
canvas { background:#04050a; border:1px solid var(--rule); border-radius:6px; width:100%; display:block; }
#side { flex:0 1 340px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:50%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
.row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>
</head>

function interpZ(zq, zs, Ts) { if (zq <= zs[0]) return Ts[0]; for (let i = 0; i < zs.length - 1; i++) if (zq <= zs[i + 1]) return Ts[i] + (Ts[i + 1] - Ts[i]) * (zq - zs[i]) / (zs[i + 1] - zs[i]); return Ts[Ts.length - 1]; }
function solveFD(alpha, nz = 96, dt = 300) {

const rmse = (a, b) => Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0) / a.length);
// ---------- UI ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), side = document.getElementById('side');
let W = 800, H = 560, tab = 'fd', alpha = D.alpha_fd, hour = 300, sim = null;
function resize() { W = cv.parentElement.clientWidth; H = Math.round(Math.min(620, Math.max(440, W * 0.72)));
  const r = window.devicePixelRatio || 1; cv.width = W * r; cv.height = H * r; cv.style.height = H + 'px'; ctx.setTransform(r, 0, 0, r, 0, 0); draw(); }
function axes(x0, y0, w, h, xr, yr, xl, yl, logy) {
  const X = v => x0 + (v - xr[0]) / (xr[1] - xr[0]) * w;
  const Y = logy ? v => y0 + h - (Math.log(v) - Math.log(yr[0])) / (Math.log(yr[1]) - Math.log(yr[0])) * h : v => y0 + h - (v - yr[0]) / (yr[1] - yr[0]) * h;

  ctx.textAlign = 'right'; const yt = logy ? [0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5] : [0, 1, 2, 3].map(i => yr[0] + i * (yr[1] - yr[0]) / 3);

}
function poly(xs, ys, X, Y, col, w = 1.5) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); xs.forEach((x, i) => i ? ctx.lineTo(X(x), Y(ys[i])) : ctx.moveTo(X(x), Y(ys[i]))); ctx.stroke(); ctx.lineWidth = 1; }
function drawFD() {
  ctx.clearRect(0, 0, W, H); if (!sim) sim = solveFD(alpha);
  const days = Array.from({ length: NH }, (_, i) => i / 24), ph = (H - 40) / 3, res = [];
  [1, 2, 3].forEach((k, p) => {
    const obs = OBS.map(r => r[k]), mod = sim.map(r => r[p]), lo = Math.min(...obs, ...mod) - 0.3, hi = Math.max(...obs, ...mod) + 0.3;
    const a = axes(56, 14 + p * ph, W - 80, ph - 34, [0, 21], [lo, hi], p === 2 ? 'Days since 8 June 2023' : '', `${D.depths[k]} cm (°C)`);

}
function drawWave() {
  ctx.clearRect(0, 0, W, H);
  const hh = (H - 50) / 2, a = axes(60, 20, W - 90, hh - 30, [0, 60], [0.1, 5], 'Depth (cm)', 'Daily amplitude (°C)', true);
  const om = 2 * Math.PI / 86400, d = Math.sqrt(2 * alpha / om) * 100;
  ctx.fillStyle = '#f6c453'; ctx.strokeStyle = '#f6c453';
  const zz = Array.from({ length: 50 }, (_, i) => 5 + i); poly(zz, zz.map(z => D.amp[0] * Math.exp(-(z - 5) / d)), a.X, a.Y, '#f6c453', 2);
  D.depths.slice(0, 4).forEach((z, i) => { ctx.fillStyle = '#e8e6e1'; ctx.beginPath(); ctx.arc(a.X(z), a.Y(D.amp[i]), 4.5, 0, 7); ctx.fill(); });
  const b = axes(60, hh + 40, W - 90, hh - 30, [0, 60], [0, 14], 'Depth (cm)', 'Lag behind 5 cm (h)');
  poly(zz, zz.map(z => 24 * ((z - 5) / d) / (2 * Math.PI)), b.X, b.Y, '#f6c453', 2);
  D.depths.slice(0, 4).forEach((z, i) => { ctx.fillStyle = '#e8e6e1'; ctx.beginPath(); ctx.arc(b.X(z), b.Y(24 * (D.phase[i] - D.phase[0]) / (2 * Math.PI)), 4.5, 0, 7); ctx.fill(); });

}
function heat(v) { const s = [[0,0,4],[87,16,110],[188,55,84],[249,142,9],[252,255,164]]; v = Math.min(1, Math.max(0, v)) * 4; const i = Math.min(3, Math.floor(v)), f = v - i; return `rgb(${s[i].map((a, k) => Math.round(a + (s[i + 1][k] - a) * f))})`; }
function drawField() {
  ctx.clearRect(0, 0, W, H);

  const y2 = y0 + h + 30, a = axes(56, y2, w, H - y2 - 40, [Math.floor(lo), Math.ceil(hi)], [100, 5], 'Temperature (°C)', 'Depth (cm)'), Yd = a.Y;
  const i = Math.min(nt - 1, Math.round(hour / NH * nt)); ctx.strokeStyle = '#f6c453'; ctx.lineWidth = 2; ctx.beginPath(); D.field_z.forEach((zc, j) => j ? ctx.lineTo(a.X(F[i][j]), Yd(zc)) : ctx.moveTo(a.X(F[i][j]), Yd(zc))); ctx.stroke(); ctx.lineWidth = 1;
  D.depths.forEach((zc, k) => { ctx.fillStyle = k === 2 ? '#ff8a8a' : '#e8e6e1'; ctx.beginPath(); ctx.arc(a.X(OBS[hour][k]), Yd(zc), 4.5, 0, 7); ctx.fill(); });
  const t = new Date(Date.parse(D.start + 'T00:00:00') + hour * 3600e3);
  document.getElementById('ro').textContent = `${t.toISOString().slice(5, 16).replace('T', ' ')} local time\nyellow: PINN profile\ndots: sensors (red: 20 cm, held out)`;
}
function draw() { if (tab === 'fd') drawFD(); else if (tab === 'wave') drawWave(); else drawField(); }
function alphaCtl() {
  return `<div class="ctl"><label>α (10⁻⁷ m²/s) <input type="range" id="al" min="${Math.log(0.5)}" max="${Math.log(40)}" step="0.01" value="${Math.log(alpha * 1e7)}"><span id="alv">${(alpha * 1e7).toFixed(2)}</span></label></div>
  <div class="row"><button data-a="${D.alpha_fd}">solver fit</button><button data-a="${D.alpha_pinn}">PINN</button><button data-a="${D.alpha_amp}">wave, 5–50 cm</button></div><div class="readout" id="ro"></div>`;
}
function wireAlpha() {
  const el = document.getElementById('al'); let timer = null;
  const set = v => { alpha = v; document.getElementById('alv').textContent = (v * 1e7).toFixed(2); clearTimeout(timer); timer = setTimeout(() => { sim = null; draw(); }, 30); };

function setTab(t) {

  else if (t === 'wave') side.innerHTML = `<h2>The daily wave</h2><p>In a uniform soil, the daily cycle's amplitude decays as e^(−z/d) and its lag grows as z/d, with d = √(2α/ω). The dots are the measured amplitudes and lags; the yellow lines are the uniform-soil theory for your α.</p><div class="math">T = T̄ + A₀ e^(−z/d) cos(ωt − z/d)</div>${alphaCtl()}`;
  else side.innerHTML = `<h2>PINN field</h2><p>The project's PINN, evaluated on a fine grid: a continuous, differentiable temperature field. Scrub through time and compare its profile with the five sensors, including the one it never saw.</p><div class="ctl"><label>Hour <input type="range" id="hr" min="0" max="${NH - 1}" step="1" value="${hour}"><span id="hrv">${hour}</span></label></div><div class="readout" id="ro"></div>`;

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', resize);
setTab('fd'); resize();
