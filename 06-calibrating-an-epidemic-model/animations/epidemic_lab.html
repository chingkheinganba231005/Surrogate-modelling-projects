<title>Epidemic Calibration Lab</title>
<style>
:root { --bg:#07080d; --panel:#121522; --fg:#e8e6e1; --muted:#9aa0b4; --accent:#8fd3ff; --rule:#272c3d; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 "Source Sans 3","Helvetica Neue",Arial,sans-serif; }
header { padding:10px 16px 0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
header h1 { font-size:17px; margin:0 12px 0 0; font-weight:600; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--panel); color:var(--fg); border:1px solid var(--rule); border-radius:6px; padding:5px 10px; font:inherit; font-size:13.5px; cursor:pointer; }
button.on { border-color:var(--accent); color:var(--accent); }
.wrap { display:flex; flex-wrap:wrap; gap:12px; padding:10px 16px 16px; }
#stage { flex:1 1 560px; min-width:0; }
canvas { background:#04050a; border:1px solid var(--rule); border-radius:6px; width:100%; display:block; }
#side { flex:0 1 340px; min-width:260px; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; }
#side h2 { font-size:15.5px; margin:0 0 6px; color:var(--accent); }
#side p { margin:0 0 8px; color:#cfd3df; font-size:14px; }
.math { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; background:#0b0d16; border:1px solid var(--rule); padding:7px 9px; border-radius:4px; margin:6px 0 10px; white-space:pre-wrap; color:#e9e3c9; }
.ctl { display:grid; gap:8px; margin-top:8px; font-size:13.5px; }
.ctl label { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.ctl input[type=range] { width:48%; }
.readout { font-family:"Source Code Pro",Menlo,monospace; font-size:12.5px; color:var(--muted); white-space:pre; margin-top:8px; overflow-x:auto; }
.row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
@media (max-width:700px) { #side { flex-basis:100%; } header h1 { font-size:15px; } }
</style>
</head>

let seed = 12345; const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed + 0.5) / 4294967296; };
function binom(n, p) {               // exact binomial draw by geometric skipping: O(n p)

}
function simulate(th, cut) {          // th = [beta, latent, bed, conv]; returns in-bed and convalescent at days 1..14, and the total ever ill
  const N = D.N, dt = 0.1, pEI = 1 - Math.exp(-dt / th[1]), pIC = 1 - Math.exp(-dt / th[2]), pCR = 1 - Math.exp(-dt / th[3]);
  let S = N - 1, E = 0, I = 1, C = 0; const bed = [], conv = [], path = [];
  for (let s = 1; s <= 140; s++) {
    const b = cut && s * dt >= cut[0] ? th[0] * (1 - cut[1]) : th[0];
    const nE = binom(S, 1 - Math.exp(-b * I / N * dt)), nI = binom(E, pEI), nC = binom(I, pIC), nR = binom(C, pCR);
    S -= nE; E += nE - nI; I += nI - nC; C += nC - nR; path.push(I);

  tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'sim') {
    const sl = (k, lab, lo, hi, st) => `<label>${lab} <input type="range" id="p${k}" min="${lo}" max="${hi}" step="${st}" value="${th[k]}"><span id="p${k}v">${th[k]}</span></label>`;
    side.innerHTML = `<h2>Simulator</h2><p>The project's stochastic model: each 0.1 day, every susceptible boy is infected with probability 1 − e^(−β I/N Δt), and every infected, ill or convalescent boy moves on with the probability of his stage. Tune the four parameters and try to match the real data. Note how often the outbreak fizzles out by chance.</p>
      <div class="ctl">${sl(0, 'β (per day)', 0.5, 4, 0.05)}${sl(1, 'latent (days)', 0.2, 3, 0.05)}${sl(2, 'in bed (days)', 1, 5, 0.05)}${sl(3, 'convalescent (days)', 1, 5, 0.05)}</div>
      <div class="row"><button id="pm">Load posterior median</button></div><div class="readout" id="ro"></div>`;
    [0, 1, 2, 3].forEach(k => { const el = document.getElementById('p' + k); el.oninput = () => { th[k] = +el.value; document.getElementById('p' + k + 'v').textContent = (+el.value).toFixed(2); draw(); }; });
    document.getElementById('pm').onclick = () => { const m = [0, 1, 2, 3].map(k => D.post.map(p => p[k]).sort((a, b) => a - b)[D.post.length >> 1]); m.forEach((v, k) => th[k] = +v.toFixed(2)); setTab('sim'); };
  } else if (t === 'hm') {
    side.innerHTML = `<h2>History matching</h2><p>Each wave runs the simulator at 120 points (8 replicates each), fits GP emulators of 10 summaries, and rules out every parameter set whose implausibility exceeds 3. The space that survives shrinks wave after wave; the posterior lives inside it.</p>
      <div class="math">I(θ) = |z − E[f(θ)]| / √(Var_em + Var_stoch + Var_obs)</div>
      <div class="row">${[[0, 2], [0, 1], [2, 3], [1, 2]].map(([i, j]) => `<button data-p="${i},${j}">${D.params[i]} vs ${D.params[j]}</button>`).join('')}</div><div class="readout" id="ro"></div>`;
    side.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => { pair = b.dataset.p.split(',').map(Number); draw(); });
  } else {
    side.innerHTML = `<h2>What if?</h2><p>The calibrated model, run for 120 posterior samples: what if the school had cut contacts (closed classes, separated dormitories) from a given day? This is the payoff of calibration: counterfactuals with honest uncertainty.</p>
      <div class="ctl"><label>From day <input type="range" id="cd" min="1" max="8" step="1" value="${cut[0]}"><span id="cdv">${cut[0]}</span></label>
      <label>Contact cut <input type="range" id="cc" min="0" max="0.9" step="0.05" value="${cut[1]}"><span id="ccv">${Math.round(cut[1] * 100)}%</span></label></div><div class="readout" id="ro"></div>`;
    const cd = document.getElementById('cd'), cc = document.getElementById('cc');
    cd.oninput = () => { cut[0] = +cd.value; document.getElementById('cdv').textContent = cd.value; draw(); };
    cc.oninput = () => { cut[1] = +cc.value; document.getElementById('ccv').textContent = Math.round(cc.value * 100) + '%'; draw(); };
  }
  draw();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
window.addEventListener('resize', resize);
setTab('sim'); resize();
</script>
</body>
</html>
